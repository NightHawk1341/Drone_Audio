# VoiceStick pipeline configuration
# All scripts accept an optional config path: python <script>.py [path/to/config.yaml]

paths:
  textgrid_dir: "B:\\Document - Disk B\\GitHub\\Drone_Audio\\data\\textgrid"   # Praat TextGrid annotation files (.TextGrid)
  audio_dir: "B:\\Document - Disk B\\GitHub\\Drone_Audio\\data\\audio"         # Raw audio recordings (.wav, 48 kHz)
  output_dir: "B:\\Document - Disk B\\GitHub\\Drone_Audio\\models"             # All pipeline outputs (models, predictions, evaluation)

data_preparation:
  tier_name: "commands"    # TextGrid tier containing command annotations
  skip_if_cached: true     # Reuse existing intermediate files if present
  test_size: 0.15          # Fraction of participants held out for testing (85/15 split)
  random_seed: 42          # Seed for reproducible train/test split

training:
  balance_classes: true    # Subsample the "none" class to reduce imbalance
  none_ratio: 1.5          # Max ratio of "none" samples vs largest command class
  n_folds: 5               # Number of cross-validation folds (GroupKFold by participant)
